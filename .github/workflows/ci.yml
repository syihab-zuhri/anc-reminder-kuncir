name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anc_reminder_test
          POSTGRES_PASSWORD: anc_test
          POSTGRES_USER: anc_test
        options: >-
          --health-cmd "pg_isready -U anc_test -d anc_reminder_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://anc_test:anc_test@localhost:5432/anc_reminder_test
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3001/api/v1
      API_HOST: 127.0.0.1
      API_PORT: 3001
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      MOTHER_SESSION_SECRET: ci-only-mother-secret-at-least-32-characters
      IDEMPOTENCY_SECRET: ci-only-idempotency-secret-at-least-32-characters
      NIK_ENCRYPTION_KEY: bm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm4=
      PUSH_TOKEN_ENCRYPTION_KEY: cHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHA=
      PRIMARY_TIMEZONE: Asia/Jakarta
      LOG_LEVEL: error
      REMINDER_INTERVAL_DAYS: 3
      PUSH_MAX_ATTEMPTS: 3
      PUSH_BACKOFF_SECONDS: 60,300,900
      WA_FALLBACK_ESCALATION_HOURS: 24
      CAPACITOR_SERVER_URL: http://localhost:3000
      PROVISION_CONFIRM: CREATE_INITIAL_PUSKESMAS
      PROVISION_HEALTH_CENTER_CODE: CI-PUSKESMAS
      PROVISION_HEALTH_CENTER_NAME: CI Synthetic Puskesmas
      PROVISION_LOGIN_IDENTIFIER: ci.puskesmas
      PROVISION_DISPLAY_NAME: CI Puskesmas Operator
      PROVISION_PASSWORD: SyntheticCiStaff2026
      SMOKE_STAFF_LOGIN_IDENTIFIER: ci.puskesmas
      SMOKE_STAFF_PASSWORD: SyntheticCiStaff2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:rollback
      - run: npm run db:rollback
      - run: npm run db:migrate
      - run: npm run db:verify:phase1
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: npm run cap:sync --workspace=@anc/android
      - run: bash ./gradlew assembleDebug
        working-directory: apps/android/android
      - run: npm run test:smoke:api
      - run: npm run test:smoke:idempotency
      - run: npm run staff:provision:puskesmas
      - run: npm run test:smoke:auth
      - run: npm run test:smoke:registry
      - run: npm run test:smoke:web-session
      - run: npm run security:secrets
      - run: npm audit --audit-level=high
